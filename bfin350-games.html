<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c57"><title>BFIN350 Finance Games</title><style>

ress>div{background:var(--teal);height:100%;transition:width .2s}.mission{border-left:5px solid var(--gold);background:#fbf5e8;padding:12px 15px;margin:14px 0;border-radius:6px}.hint{margin:14px 0;border-radius:10px;background:#fffae8;border:1px solid #f5d991;padding:12px 15px}.answer{margin-top:12px;padding:16px;border-radius:12px;background:#eef7f9}.score{font-size:80px;font-weight:900;color:var(--navy);margin:0;text-align:center}.winner{text-align:center}.small{font-size:14px}.selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.chapter{border:2px solid #d7e5f2;border-radius:15px;padding:16px;background:white;text-decoration:none;color:var(--navy);font-weight:800}.chapter:hover{border-color:var(--teal)}footer{padding:22px;text-align:center;font-size:14px;color:#668}.timer{font-variant-numeric:tabular-nums;font-weight:800;color:#d0f5ff}.warning{color:#b02235}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}@media(max-width:520px){header b{font-size:16px}.option{font-size:17px;padding:15px}.container{margin:10px auto}.card{border-radius:16px}.score{font-size:64px}}</style></head><body><header><div><b>◈ BFIN350 • FINANCE QUESTS</b><div><small>The International University • Team Edition</small></div></div><div id="clock" class="timer"></div></header><div class="container" id="app"></div><footer>Classroom learning • No account required • Results stay on this device</footer><script>
const DATA={"10":{"title":"The WACC Vault","tag":"Unlock the cost of capital","theme":"vault","emoji":"🏦","missions":["Identify the Capital","Debt Chamber","Equity Corridor","WACC Console","Final Vault"],"q":[["What does WACC represent?",["Average cost of the firm's financing","Total annual sales","Interest on every asset","Dividend payout ratio"],0,"Think about debt and equity together.","WACC is the weighted average cost of the firm's capital."],["Which financing source gets the interest tax shield?",["Common equity","Preferred stock","Debt","Retained earnings"],2,"Which one pays deductible interest?","Interest on debt can reduce taxable income."],["Debt costs 8% and tax rate is 25%. After-tax debt cost?",["8%","6%","10%","2%"],1,"Multiply 8% by (1−0.25).","8% × 0.75 = 6%."],["Preferred dividend is $6 and price is $75. Cost of preferred?",["6%","7%","8%","9%"],2,"Dividend ÷ price.","6 ÷ 75 = 8%."],["CAPM: risk-free 4%, market premium 6%, beta 1.2. Equity cost?",["9.2%","11.2%","12%","7.2%"],1,"4% + 1.2 × 6%.","4 + 7.2 = 11.2%."],["Which is usually used as the project hurdle rate for average-risk projects?",["Gross margin","WACC","Current ratio","Payout ratio"],1,"Use the overall cost of financing.","WACC is often the discount rate for average-risk projects."],["Debt 40%, equity 60%; after-tax debt 6%, equity 11%. WACC?",["8.0%","9.0%","10.0%","11.0%"],1,"0.4×6 + 0.6×11.","2.4% + 6.6% = 9.0%."],["Project return is 13%; suitable WACC is 10%. Basic decision?",["Reject","Accept","Ignore cost of capital","Raise the tax rate"],1,"Compare expected return to hurdle rate.","The project exceeds its required return."],["Why use capital structure weights in WACC?",["Capital sources have different proportions","To remove taxes","To calculate inventory","To find total shares"],0,"Not every dollar comes from the same source.","Each funding source contributes according to its share."],["Firm raises new equity with flotation costs. Compared with retained earnings, new equity may be...",["Cheaper","More expensive","Always tax-deductible","Free"],1,"Issuing shares is not costless.","Flotation costs can raise the effective cost of new equity."]]},"11":{"title":"The Capital Budgeting Escape","tag":"Choose the projects that open the door","theme":"escape","emoji":"🚪","missions":["Project Entry","NPV Lock","IRR Passage","Payback Gate","Investment Exit"],"q":[["Capital budgeting evaluates...",["Daily petty cash","Long-term investments","Payroll only","Customer complaints"],1,"Think machines and new branches.","Capital budgeting assesses long-term projects."],["An investment costs $100 now and pays $120 in one year. At 10%, NPV is closest to...",["+$9.09","+$20","−$9.09","$0"],0,"120/1.10−100.","NPV = 109.09−100 = +9.09."],["A positive NPV generally means...",["The project destroys value","The project adds value","The payback is zero","Risk disappears"],1,"NPV compares PV of benefits with cost.","Positive NPV indicates expected value creation."],["IRR is the discount rate that makes...",["Sales zero","NPV zero","Tax zero","Debt zero"],1,"Its defining equation sets a value measure to zero.","IRR sets NPV to zero."],["A project's IRR is 14% and required return 10%. Accept?",["Yes","No","Only if debt is zero","Never"],0,"Compare IRR with required return.","14% exceeds 10%."],["Initial cost $90; cash inflow $30 each year. Simple payback?",["2 years","3 years","4 years","5 years"],1,"90÷30.","Three years."],["Which method discounts future cash flows before measuring recovery?",["Simple payback","Discounted payback","Accounting ROE","Sales growth"],1,"It adds the time value of money.","Discounted payback uses discounted cash inflows."],["For mutually exclusive projects, which measure is generally preferred?",["Higher NPV","Shortest title","Largest sales","Highest initial cost"],0,"Choose the project that adds the most value.","NPV measures shareholder value added."],["Cash flows are $40 in years 1 and 2; discount rate 0%, cost $70. NPV?",["−$10","+$10","+$40","+$80"],1,"At 0%, PV equals undiscounted cash.","40+40−70 = +10."],["MIRR generally assumes positive cash flows are reinvested at...",["The cost of capital","The initial cash outflow","A zero rate","The tax rate"],0,"It avoids the IRR reinvestment assumption.","MIRR uses a specified reinvestment rate, often WACC."]]},"12":{"title":"Cash Flow Detective","tag":"Find the cash that really counts","theme":"detective","emoji":"🕵️","missions":["Evidence Desk","Cash Clues","Tax Trail","Risk Lab","Case Closed"],"q":[["Relevant project cash flows must be...",["Historical","Incremental","Accounting only","Guaranteed"],1,"Ask what changes if the project is accepted.","Relevant cash flows are incremental."],["A market study paid last month is usually a...",["Sunk cost","Terminal cash flow","Opportunity cost","Financing inflow"],0,"Already paid and unrecoverable.","Past unrecoverable spending is a sunk cost."],["Rent forgone by using an owned building for a project is...",["Irrelevant","Opportunity cost","Depreciation","Interest"],1,"What alternative benefit do you sacrifice?","Forgone rent is an opportunity cost."],["Depreciation is valuable to cash flow because it...",["Creates cash sales","Reduces taxable profit","Raises inventory","Replaces capex"],1,"Think depreciation tax shield.","Depreciation can reduce taxes."],["Revenue $200, cash costs $100, depreciation $40, tax 25%. OCF?",["$115","$85","$60","$100"],0,"EBIT=60; tax=15; add back 40.","OCF=(200−100−40)×0.75+40 = $85."],["A project needs $20 more NOWC initially. Its initial free cash flow...",["Rises $20","Falls $20","Unchanged","Rises $40"],1,"More working capital ties up cash.","An increase in NOWC is a cash outflow."],["At project end, release of $20 NOWC usually creates...",["A cash inflow","A cash outflow","Depreciation expense","No impact"],0,"Working capital is recovered.","Recovery of NOWC is a terminal inflow."],["Selling equipment for more than book value generally creates...",["No tax impact","Tax on gain","A tax credit on gain","A dividend"],1,"Sale price above tax book value is a taxable gain.","Gains on disposal can generate taxes."],["Which test changes one input at a time?",["Sensitivity analysis","Scenario analysis","Diversification","Ratio analysis"],0,"One variable, many values.","Sensitivity analysis varies one assumption at a time."],["When comparing unequal-life repeatable projects, use...",["EAA","Payout ratio","Quick ratio","Nominal sales"],0,"Equalize annual value.","Equivalent annual annuity can compare unequal lives."]]},"14":{"title":"Leverage Tower","tag":"Climb the capital structure","theme":"tower","emoji":"🏗️","missions":["Funding Floor","Risk Floor","Break-even Floor","EPS Floor","Rooftop Decision"],"q":[["Financial risk increases primarily when a firm adds...",["Debt financing","Inventory","Cash sales","Depreciation"],0,"Think fixed interest commitments.","Debt adds fixed financing obligations."],["Business risk exists even if the firm has...",["No debt","No sales","No fixed assets","No managers"],0,"It comes from operations.","Operating uncertainty remains without debt."],["Selling price $20, variable cost $12, fixed cost $800. Break-even units?",["50","100","150","200"],1,"800/(20−12).","800/8=100 units."],["A high proportion of fixed operating costs causes high...",["Operating leverage","Cash conversion cycle","Dividend payout","Current ratio"],0,"Fixed costs amplify EBIT changes.","Operating leverage makes EBIT more sensitive to sales."],["EBIT equals...",["Sales − variable costs − fixed operating costs","Sales − dividends","Assets − debt","Cash − inventory"],0,"Earnings before interest and taxes.","EBIT is operating income before interest and tax."],["ROIC uses which profit measure in the numerator?",["EBIT(1−T)","Sales","Dividends","Gross assets"],0,"After-tax operating profit.","ROIC = EBIT(1−T)/invested capital."],["EBIT $100, interest $20, tax 25%. Net income?",["$60","$80","$100","$75"],0,"(100−20)×0.75.","NI=$60."],["Net income $60 and 30 shares outstanding. EPS?",["$0.50","$2","$30","$60"],1,"Income divided by shares.","EPS=60/30=$2."],["More debt may raise ROE when returns on assets exceed...",["Borrowing cost","The number of shares","Inventory turnover","Dividends paid"],0,"Compare operating return with interest cost.","Positive leverage requires a favorable spread."],["Which financing mix is universally optimal for every firm?",["100% debt","100% equity","50/50","No universal mix"],3,"Risk and business conditions differ.","Optimal capital structure varies by firm."]]},"15":{"title":"Dividend Treasure Hunt","tag":"Unlock the shareholders' reward","theme":"treasure","emoji":"💰","missions":["Profit Map","Payout Cave","Residual Bridge","Share Split","Treasure Chest"],"q":[["Dividend payout ratio equals...",["Dividends / net income","Net income / assets","Debt / equity","Dividends / sales"],0,"Cash paid relative to earnings.","Dividend payout = dividends divided by net income."],["Net income $200M, dividends $50M. Payout ratio?",["20%","25%","50%","75%"],1,"50÷200.","25%."],["The retention ratio in that example is...",["25%","50%","75%","100%"],2,"1−payout.","75%."],["Under residual policy, firms fund positive-NPV projects using...",["Retained earnings first","Dividends first","Only new debt","Only bonds"],0,"What remains is distributed.","Residual policy retains equity needs first."],["Capital budget $100M, equity ratio 60%. Equity funding needed?",["$40M","$60M","$100M","$160M"],1,"Budget × equity percentage.","$100M×60%=$60M."],["Net income $90M and equity need $60M. Residual dividend?",["$0","$30M","$60M","$90M"],1,"Income−equity need.","$90M−$60M=$30M."],["Net income $40M, equity need $60M. Dividend?",["$20M","$40M","$0","$60M"],2,"Cannot distribute negative dividends.","Dividend = 0; equity funding gap is $20M."],["A DRIP generally helps investors...",["Automatically reinvest dividends","Avoid every tax","Convert bonds to debt","Guarantee a profit"],0,"The initials include 'reinvestment'.","DRIP = dividend reinvestment plan."],["A 2-for-1 split turns 100 shares into...",["50","100","200","400"],2,"Each share becomes two.","200 shares."],["100 shares receive a 10% stock dividend. New share total?",["100","105","110","200"],2,"Add 10% of 100 shares.","10 new shares; 110 total."]]},"16":{"title":"Cash Cycle Race","tag":"Beat the working-capital clock","theme":"race","emoji":"⏱️","missions":["Liquidity Start","Policy Lane","CCC Loop","Cash Checkpoint","Trade Credit Finish"],"q":[["Net working capital equals...",["Current assets − current liabilities","Sales − costs","Debt − equity","Cash − sales"],0,"Two current balance-sheet totals.","NWC = current assets minus current liabilities."],["Current assets $300, current liabilities $220. NWC?",["$80","$220","$300","$520"],0,"Subtract liabilities from assets.","$300−$220=$80."],["NOWC normally includes...",["Inventory and receivables","Notes payable","Long-term bonds","Excess cash only"],0,"Use operating items.","Inventory and A/R are operating current assets."],["A relaxed current-asset policy generally holds...",["More cash and inventory","Minimum cash only","No inventory","Only debt"],0,"Conservative means cushion.","Relaxed policies favor liquidity."],["CCC formula is...",["Inventory days + collection days − payable days","Inventory + sales","Payable days + cash","Receivables − sales"],0,"Add days tied up, subtract supplier credit.","CCC = ICP + ACP − PDP."],["Inventory 50 days, collections 35 days, payable deferral 25 days. CCC?",["40 days","60 days","85 days","110 days"],1,"50+35−25.","60 days."],["Reducing receivables collection time generally...",["Shortens CCC","Lengthens CCC","Does nothing","Eliminates sales"],0,"Cash arrives sooner.","Faster collection reduces CCC."],["Beginning cash $5k, receipts $30k, payments $25k. Ending cash?",["$0","$5k","$10k","$60k"],2,"5+30−25.","$10k."],["Terms 2/10, net 30 mean 2% discount if paid within...",["2 days","10 days","20 days","30 days"],1,"The number after / is discount deadline.","2% off for payment within 10 days."],["Not taking a supplier discount can represent...",["An implicit financing cost","Free money","A capital gain","A tax refund"],0,"Paying later can cost more.","Forgone discounts create implicit trade-credit cost."]]},"17":{"title":"Forecasting Time Machine","tag":"Predict growth, fund the future","theme":"time","emoji":"🕰️","missions":["History Dial","Forecast Dial","AFN Engine","Growth Lock","Future Portal"],"q":[["A financial plan usually begins with...",["Sales forecast","Dividend payment","Merger offer","Stock split"],0,"Estimate future business volume.","Sales forecasts drive many financial projections."],["Sales rise from $100M to $120M. Growth rate?",["10%","20%","25%","120%"],1,"(120−100)/100.","20%."],["AFN stands for...",["Additional funds needed","Annual fixed netting","Asset financing number","Average forecast net"],0,"External funding gap.","AFN = additional funds needed."],["AFN is projected asset increase minus...",["Spontaneous liability increase and retained earnings","Sales and profits","Fixed assets only","Interest only"],0,"Two internal funding sources offset assets.","AFN = Δassets−Δspontaneous liabilities−addition to RE."],["Assets/sales = 60%; projected extra sales $50M. Additional assets?",["$20M","$30M","$50M","$83M"],1,"0.6×50.","$30M."],["Assets increase $30M, spontaneous liabilities $8M, retained earnings $12M. AFN?",["$10M","$22M","$30M","$50M"],0,"30−8−12.","$10M."],["A positive AFN means a firm likely needs...",["External financing","No financing","Fewer assets","Negative sales"],0,"Internal funds are insufficient.","A positive gap calls for outside capital."],["If payout ratio is 30%, retention ratio is...",["30%","50%","70%","100%"],2,"1−0.30.","70%."],["Other things equal, higher retained earnings generally make AFN...",["Smaller","Larger","Unchanged","Always negative"],0,"More internal funding reduces the gap.","Higher RE reduces external funds needed."],["Sustainable growth focuses on growth without...",["New outside equity under its usual assumptions","Any sales","Any profits","Any assets"],0,"Think self-financed equity growth.","Sustainable growth uses earnings retention and target leverage assumptions."]]},"21":{"title":"Merger Mystery Mansion","tag":"Value the deal and unlock the exit","theme":"mansion","emoji":"🏰","missions":["Synergy Hall","Merger Gallery","DCF Library","CAPM Cellar","Offer Room"],"q":[["Merger synergy means...",["Combined value exceeds separate values","Firms have same names","All costs vanish","A bigger firm is always safer"],0,"Whole greater than parts.","Synergy = V(AB)−[V(A)+V(B)]."],["Firms A and B worth $80M and $40M; combined worth $135M. Synergy?",["$15M","$40M","$120M","$135M"],0,"135−(80+40).","$15M."],["Two competing grocery chains merge. Merger type?",["Vertical","Horizontal","Conglomerate","Unrelated"],1,"They operate at the same level.","Horizontal merger."],["A manufacturer buys its parts supplier. Type?",["Vertical","Horizontal","Conglomerate","None"],0,"Supplier relationship.","Vertical merger."],["Closing duplicated headquarters is an example of...",["Operating economies","CAPM","Dividend signaling","External finance"],0,"Savings in operations.","Operating synergies lower duplicated costs."],["DCF value is primarily the present value of...",["Expected future cash flows","Historical sales only","Market share only","Employee count"],0,"Discount forecast cash.","DCF brings expected cash flows back to today."],["A cash flow of $110 next year discounted at 10% is worth today...",["$100","$110","$121","$10"],0,"110/1.10.","$100."],["Gordon continuing value equals...",["CF next year/(r−g)","CF current×r","r+g","Net income−debt"],0,"Perpetuity growing at g.","TV=CF_(n+1)/(r−g), if r>g."],["CAPM: risk-free 4%, beta 1.0, market premium 6%. Equity cost?",["4%","6%","10%","14%"],2,"4+1×6.","10%."],["Target minimum acceptable $50M, acquirer's value $65M. Negotiation range?",["$50M–$65M","Over $65M only","Under $50M only","No possible agreement"],0,"Target's floor, acquirer's ceiling.","The feasible price range lies between the two values."]]}};
let key=new URLSearchParams(location.search).get("ch");const app=document.getElementById("app"),clock=document.getElementById("clock");let game=DATA[key],team="",members=2,index=0,answers=[],hintsUsed={},hintShown={},deadline=0,ticking=null,done=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){document.title="BFIN350 Team Games";app.innerHTML='<div class="card"><div class="eyebrow">Choose a chapter</div><h1 class="hero">Finance quests</h1><p>Ten multiple-choice questions. A 12-minute timer. Play in teams of 2, 3 or 4. 100 points maximum; each hint costs 2 points.</p><div class="selector">'+Object.entries(DATA).map(([k,g])=>'<a class="chapter" href="?ch='+k+'"><div style="font-size:35px">'+g.emoji+'</div>Chapter '+k+'<br><span class="muted small">'+esc(g.title)+'</span></a>').join('')+'</div></div>';}
function startPage(){document.title=game.title+" | BFIN350";app.innerHTML='<div class="card"><div class="eyebrow">Chapter '+key+' • Team mini-game</div><h1 class="hero">'+game.emoji+' '+esc(game.title)+'</h1><p style="font-size:23px;color:var(--red);font-weight:750">'+esc(game.tag)+'</p><div class="mission"><b>Mission briefing:</b> Unlock five stages by answering 10 MCQs. Every correct answer earns 10 points. Each opened hint costs 2 points. You have <b>12 minutes</b> (the game automatically ends when time runs out).</div><label><b>Team name</b><input id="teamname" maxlength="35" placeholder="e.g., The Finance Ninjas" autocomplete="off"></label><label><b>Number of team members</b><select id="members"><option value="2">2 students</option><option value="3">3 students</option><option value="4">4 students</option></select></label><p class="small muted">One device per team. Discuss answers together. No login; no student names or scores are sent to a server.</p><button class="btn" id="start">Start the mission</button></div>';document.getElementById("start").onclick=()=>{team=document.getElementById("teamname").value.trim()||"Team "+key;members=Number(document.getElementById("members").value);deadline=Date.now()+12*60*1000;done=false;index=0;answers=[];hintsUsed={};hintShown={};ticking=setInterval(updateClock,250);updateClock();showQ()};}
function updateClock(){if(done)return;let remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));clock.textContent="⏱ "+Math.floor(remaining/60)+":"+String(remaining%60).padStart(2,"0");if(remaining<=0)finish(true)}
function showQ(){if(done)return;const q=game.q[index];let stage=game.missions[Math.floor(index/2)];let h=!!hintShown[index];app.innerHTML='<div class="card"><div class="grid"><span class="badge">'+esc(stage)+'</span><strong>Question '+(index+1)+' / 10</strong></div><div class="progress"><div style="width:'+((index)/10*100)+'%"></div></div><p class="eyebrow">'+esc(team)+' • '+members+' members</p><h2>'+esc(q[0])+'</h2><div class="options">'+q[1].map((a,i)=>'<button class="option" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(a)+'</button>').join('')+'</div><div id="hintbox">'+(h?'<div class="hint">💡 '+esc(q[3])+'</div>':'')+'</div><div class="controls"><button class="btn secondary" id="hint" '+(h?'disabled':'')+'>💡 '+(h?'Hint used':'Show hint (−2 points)')+'</button><span class="muted">Answer once • No typing</span></div></div>';document.querySelectorAll(".option").forEach(b=>b.onclick=()=>submit(Number(b.dataset.i)));document.getElementById("hint").onclick=()=>{if(!hintShown[index]){hintShown[index]=true;hintsUsed[index]=true;showQ()}};}
function submit(choice){if(done||Date.now()>deadline){finish(true);return}answers[index]=choice;const q=game.q[index],right=choice===q[2];document.querySelectorAll(".option").forEach((b,i)=>{b.disabled=true;b.classList.toggle("selected",i===choice);if(i===q[2]){b.style.borderColor="#15803d";b.style.background="#e7f6e8"}});document.getElementById("hint").disabled=true;let d=document.createElement("div");d.className="answer";d.innerHTML='<b>'+(right?'✅ Correct!':'🔐 Not quite.')+'</b><p>'+esc(q[4])+'</p><button class="btn teal" id="next">'+(index===9?'Reveal team score':'Continue →')+'</button>';document.querySelector(".card").appendChild(d);document.getElementById("next").onclick=()=>{index++;if(index>=10)finish(false);else showQ()}}
function finish(timed){if(done)return;done=true;clearInterval(ticking);clock.textContent="Mission complete";let correct=answers.filter((a,i)=>a===game.q[i][2]).length;let hints=Object.keys(hintsUsed).length;let score=Math.max(0,correct*10-hints*2);let pct=correct*10;let rank=score>=85?"Master Financiers":score>=65?"Skilled Analysts":score>=45?"Rising Strategists":"Finance Explorers";app.innerHTML='<div class="card winner"><div class="eyebrow">'+esc(game.missions[4])+' • '+(timed?"Time expired":"All locks attempted")+'</div><h1 class="hero">'+game.emoji+' '+esc(game.title)+'</h1><p class="badge">'+esc(rank)+'</p><p class="muted">TEAM: <b>'+esc(team)+'</b> · '+members+' MEMBERS</p><p class="score">'+score+'<span style="font-size:32px"> / 100</span></p><p><b>'+correct+'</b> correct answers × 10 = '+pct+' points<br><b>'+hints+'</b> hints used × −2 = −'+(hints*2)+' points</p><div class="mission"><b>Show this screen to your instructor.</b><br>Chapter '+key+' · Team '+esc(team)+' · Final score '+score+'/100</div><div class="controls"><button class="btn secondary" onclick="window.print()">Print / Save screen</button><a href="?ch='+key+'" class="btn teal" style="text-decoration:none">Play again</a></div><p class="small muted">No results were uploaded or stored centrally.</p></div>';}
if(game)startPage();else home();
